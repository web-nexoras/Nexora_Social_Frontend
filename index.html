<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexoras Social</title>
    <script>
      // Default is ALWAYS light. Dark is applied only when the user explicitly
      // chose it (Sidebar → Appearance). We never consult prefers-color-scheme,
      // so the OS switching to dark can never flip the app on its own.
      try {
        if (localStorage.getItem("theme") === "dark") {
          document.documentElement.classList.add("dark");
        } else {
          document.documentElement.classList.remove("dark");
        }
      } catch {
        // Storage blocked — stay on the default light theme.
      }
    </script>
  </head>
  <body class="bg-slate-50">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
